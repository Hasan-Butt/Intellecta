<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon — multi-size for crisp rendering at all sizes -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="16x16"  href="%PUBLIC_URL%/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32"  href="%PUBLIC_URL%/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48"  href="%PUBLIC_URL%/favicon-48x48.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/favicon-192x192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/favicon-512x512.png?v=2" />


    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Intellecta is a smart study companion for students. Features Pomodoro timer, quiz system, notes, gamification, analytics, and more."
    />

    <!-- Open Graph (for LinkedIn/social shares you already made) -->
    <meta
      property="og:title"
      content="Intellecta – Smart Study Planner, Helper & Analyzer"
    />
    <meta
      property="og:description"
      content="Plan, execute, and analyze your study sessions with gamification, and analytics."
    />
    <meta property="og:url" content="https://intellecta.hasanbutt.me" />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://intellecta.hasanbutt.me/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Intellecta – Smart Study Planner, Helper & Analyzer" />
    <meta name="twitter:description" content="Plan, execute, and analyze your study sessions with gamification, and analytics." />
    <meta name="twitter:image" content="https://intellecta.hasanbutt.me/og-image.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://intellecta.hasanbutt.me" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/favicon-192x192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Intellecta – Smart Study Planner & Productivity App</title>

    <!-- JSON-LD: WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Intellecta",
        "url": "https://intellecta.hasanbutt.me",
        "description": "Smart study planner and productivity app for students",
        "applicationCategory": "EducationApplication",
        "operatingSystem": "Web",
        "logo": {
          "@type": "ImageObject",
          "url": "https://intellecta.hasanbutt.me/favicon-512x512.png",
          "width": 512,
          "height": 512
        }
      }
    </script>

    <!-- JSON-LD: Organization (used by Google for sitelinks icon) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Intellecta",
        "url": "https://intellecta.hasanbutt.me",
        "logo": "https://intellecta.hasanbutt.me/favicon-512x512.png"
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
