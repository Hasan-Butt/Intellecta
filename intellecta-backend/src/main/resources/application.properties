# HTTPS (PRODUCTION)
# Terminate TLS at the load balancer / reverse proxy (recommended), OR let
# Spring Boot handle it with a PKCS#12 keystore, e.g.:
#   server.ssl.enabled=true
#   server.ssl.key-store-type=PKCS12
#   server.ssl.key-store=./intellecta.p12
#   server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
#   server.ssl.key-alias=intellecta
# When TLS is active, also set the secure cookie flag so JWTs are never sent
# over plaintext HTTP:
#   app.security.cookie-secure=true
# Set the actual token in Railway / local .env — never commit live keys to git
uploadthing.token=${UPLOADTHING_TOKEN:}
