spring.application.name=Intellecta Backend
server.port=${PORT:8080}

# Active profile. Defaults to dev for local development.
# Production deployments MUST override this, e.g. SPRING_PROFILES_ACTIVE=prod.
# The dev profile seeds accounts with weak test passwords (DataSeeder is @Profile("dev")).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# SHARED DATABASE SETTINGS (Can be overridden by Azure App Settings: SPRING_DATASOURCE_URL, etc.)
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# File upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# CORS ALLOWED ORIGINS (Override via CORS_ALLOWED_ORIGIN env var in production)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# SHARED SECURITY/JWT
# Generate a strong key: openssl rand -base64 64
# Override via JWT_SECRET env var in production
jwt.secret=${JWT_SECRET:St4iDJ0aM/FZqlBAnB8VfLYefFJ1LD2KdoK4OtyEnao2y73Mub2377AQ3Xi6x0rtJ1LvicFvjqPItJCAb4+zdg==}
jwt.expiration=86400000

